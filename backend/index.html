<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Crypto Stock Pro — Web Preview Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-custom { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; }
        .badge-buy { background-color: #16a34a; color: #fff; font-weight: 600; }
        .badge-sell { background-color: #dc2626; color: #fff; font-weight: 600; }
        .badge-hold { background-color: #64748b; color: #fff; font-weight: 600; }
        .text-green { color: #4ade80; }
        .text-red { color: #f87171; }
        .btn-tab { background-color: #1e293b; color: #94a3b8; border: 1px solid #334155; }
        .btn-tab.active { background-color: #2563eb; color: #fff; border-color: #2563eb; }
    </style>
</head>
<body class="p-3 p-md-4">
    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold m-0 text-white">AI Crypto Stock Pro <span class="badge bg-primary fs-6">Live Preview</span></h3>
                <small class="text-secondary">Dashboard Sinyal & Indikator Real-Time</small>
            </div>
            <div id="serverTime" class="small text-secondary">Loading...</div>
        </div>

        <!-- Filter Pasar -->
        <div class="d-flex gap-2 mb-4 overflow-auto pb-2">
            <button class="btn btn-tab active" onclick="loadDashboard('crypto', this)">Crypto</button>
            <button class="btn btn-tab" onclick="loadDashboard('stock_id', this)">Saham Indo</button>
            <button class="btn btn-tab" onclick="loadDashboard('stock_us', this)">Saham US</button>
            <button class="btn btn-tab" onclick="loadDashboard('gold_silver', this)">Emas & Perak</button>
            <button class="btn btn-tab" onclick="loadDashboard('forex', this)">Forex</button>
        </div>

        <!-- Grid Cards Asset -->
        <div id="assetsGrid" class="row g-3">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-secondary">Memuat data sinyal dari VPS...</p>
            </div>
        </div>
    </div>

    <script>
        let currentMarket = 'crypto';

        async function loadDashboard(market = 'crypto', btnEl = null) {
            currentMarket = market;
            if (btnEl) {
                document.querySelectorAll('.btn-tab').forEach(b => b.classList.remove('active'));
                btnEl.classList.add('active');
            }

            const grid = document.getElementById('assetsGrid');
            grid.innerHTML = `
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-secondary">Memuat sinyal pasar ${market.toUpperCase()}...</p>
                </div>`;

            try {
                // Mengarahkan fetch langsung ke IP VPS
                const res = await fetch(`http://165.245.196.44:8000/api/dashboard?market=${market}&timeframe=1h&full=true`);
                const data = await res.json();

                document.getElementById('serverTime').innerText = 'Server Time: ' + new Date(data.server_time).toLocaleString();

                if (!data.assets || data.assets.length === 0) {
                    grid.innerHTML = `<div class="col-12 text-center text-secondary py-5">Tidak ada sinyal aktif yang memenuhi kriteria saat ini.</div>`;
                    return;
                }

                grid.innerHTML = data.assets.map(a => {
                    const actionClass = a.action === 'BUY' ? 'badge-buy' : (a.action === 'SELL' ? 'badge-sell' : 'badge-hold');
                    const changeClass = (a.change_pct_24h || 0) >= 0 ? 'text-green' : 'text-red';
                    
                    return `
                        <div class="col-12 col-md-6 col-lg-4 col-xl-3">
                            <div class="card card-custom p-3 h-100">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <h5 class="fw-bold m-0">${a.symbol}</h5>
                                    <span class="badge ${actionClass}">${a.action} (${a.confidence}%)</span>
                                </div>
                                <div class="d-flex justify-content-between align-items-baseline mb-3">
                                    <h4 class="m-0 text-white">$${a.price ? a.price.toLocaleString() : '-'}</h4>
                                    <span class="small ${changeClass}">${a.change_pct_24h ? a.change_pct_24h.toFixed(2) + '%' : ''}</span>
                                </div>
                                <div class="p-2 rounded bg-dark bg-opacity-50 small mb-2">
                                    <div class="d-flex justify-content-between"><span>Entry:</span> <strong class="text-warning">$${a.entry ? a.entry.toLocaleString() : '-'}</strong></div>
                                    <div class="d-flex justify-content-between"><span>Take Profit:</span> <strong class="text-green">$${a.take_profit ? a.take_profit.toLocaleString() : '-'}</strong></div>
                                    <div class="d-flex justify-content-between"><span>Stop Loss:</span> <strong class="text-red">$${a.stop_loss ? a.stop_loss.toLocaleString() : '-'}</strong></div>
                                </div>
                                <div class="small text-secondary">
                                    <strong>Analisis:</strong> ${a.reasons && a.reasons.length ? a.reasons[0] : 'Sinyal konfluensi indikator.'}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                grid.innerHTML = `<div class="col-12 text-center text-danger py-5">Gagal memuat data dari server: ${err.message}</div>`;
            }
        }

        // Auto load saat pertama dibuka
        loadDashboard('crypto');
    </script>
</body>
</html>
